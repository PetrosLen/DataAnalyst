# Πρώτο seed batch — Θεσσαλονίκη, verticals "ήσυχο ποτό/καφέ" + "date spots".
#
# ΠΡΟΕΛΕΥΣΗ: Τα venues παρακάτω εντοπίστηκαν μέσω web research (άρθρα τοπικών
# guides/blogs, επίσημες καταχωρήσεις επιχειρήσεων) από τον Claude, ΟΧΙ μέσω
# προσωπικής επίσκεψης/τηλεφωνικής επιβεβαίωσης. Γι' αυτό:
#   - status = "pending" σε ΟΛΑ (δεν είναι public μέχρι να τα εγκρίνει admin)
#   - overall_confidence χαμηλό-μέτριο (0.35-0.45)
#   - source_type = "claude_assisted" με source_ref = τα URLs που βρέθηκαν
#   - geo_precision "address" = γεωκωδικοποιήθηκε η ακριβής διεύθυνση,
#     "district" = δεν βρέθηκε η ακριβής διεύθυνση σε OpenStreetMap και
#     χρησιμοποιήθηκε το κέντρο της γειτονιάς αντ' αυτού (χρειάζεται GPS pin
#     επιβεβαίωση πριν γίνει active)
#   - ωράρια μπήκαν ΜΟΝΟ όπου βρέθηκε ρητά δηλωμένο ωράριο σε πηγή· όλα τα
#     άλλα venues δεν έχουν καθόλου venue_hours rows (= άγνωστο ωράριο, όχι
#     εικασία)
#
# Επόμενο βήμα (admin, όχι αυτόματο): τηλεφωνική επιβεβαίωση/επίσκεψη ανά
# venue πριν εγκριθεί σε status=active. Βλ. docs/where-to/PRODUCT_DESIGN.md §8.

